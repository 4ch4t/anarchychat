<style>
:root{color-scheme:dark;--line:rgba(120,108,220,.18);--line-hi:rgba(150,138,240,.42);--text:#cdcae6;--dim:#8581ae;--accent:#7466e0;--accent-hi:#b4abff;--rose:#e04478;--ok:#38c196}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  display:grid;place-items:center;padding:24px;color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(ellipse 70% 55% at 12% -5%,rgba(70,50,190,.14),transparent 70%),
    radial-gradient(ellipse 55% 60% at 105% 105%,rgba(30,80,200,.10),transparent 70%),
    radial-gradient(1px 1px at 23px 41px,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 131px 97px,rgba(200,210,255,.35),transparent 60%),
    radial-gradient(1px 1px at 77px 163px,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 211px 29px,rgba(190,170,255,.35),transparent 60%),
    radial-gradient(1px 1px at 301px 187px,rgba(170,215,255,.45),transparent 60%),
    #010105;
  background-size:auto,auto,257px 263px,311px 307px,379px 383px,251px 257px,433px 419px,auto;
}
.card{
  width:min(380px,100%);padding:30px 28px 26px;text-align:center;border-radius:16px;
  border:1px solid var(--line-hi);background:linear-gradient(180deg,rgba(14,11,38,.92),rgba(5,4,16,.95));
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.logo{display:block;width:168px;height:60px;margin:0 auto 18px;border-radius:12px;border:1px solid var(--line-hi);object-fit:cover}
h1{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:-.01em;color:#ece9ff}
.ver{font:600 12px/1 Consolas,"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.04em;color:#b4b0e6;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:rgba(130,116,245,.1)}
#status{margin-top:16px;min-height:1.5em;font:13px/1.5 Consolas,"SF Mono",ui-monospace,Menlo,monospace;color:#b9b5e0}
body[data-state="offline"] #status,body[data-state="setup"] #status{color:#ff9bbb}
body[data-state="online"] #status{color:var(--ok)}
.bar{height:3px;margin-top:16px;border-radius:3px;background:rgba(130,116,245,.14);overflow:hidden}
.bar i{display:block;height:100%;width:35%;border-radius:3px;background:linear-gradient(90deg,#4d58c4,#b4abff);animation:sweep 1.3s ease-in-out infinite}
body[data-state="online"] .bar i{width:100%;animation:none;background:var(--ok)}
body[data-state="offline"] .bar,body[data-state="setup"] .bar{display:none}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
.actions{display:none;margin-top:18px;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
body[data-state="offline"] .actions{display:flex}
button{
  font:inherit;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer;color:#f1efff;
  border:1px solid rgba(165,155,255,.45);background:linear-gradient(135deg,#5546c4,#3a68c4);transition:filter .15s,border-color .15s
}
button:hover{filter:brightness(1.18);border-color:rgba(190,180,255,.7)}
a.open{color:var(--accent-hi);text-decoration:none;padding:8px 4px}
a.open:hover{text-decoration:underline}
button:focus-visible,a:focus-visible{outline:2px solid #56b2e2;outline-offset:3px}
#hint{margin-top:14px;font-size:12.5px;color:var(--dim)}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#010105}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.6}}
</style>
</head>

  <h1>4ChatSDR <span class="ver">1.1 Beta</span></h1>
  <p id="status" role="status" aria-live="polite">Contacting the server…</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="actions">
    <button id="retry" type="button">Try again</button>
    <a class="open" id="open" href="#">Open anyway</a>
  </div>
  <p id="hint"></p>
</main>

<script>
(() => {
  /* ============ SETTINGS ============ */
  const CONFIG_FILE = "server.json";   // holds your current cloudflared link: {"url": "https://xxxx.trycloudflare.com"}
  const MODE  = "embed";               // "embed" = site opens inside this page (github.io stays in the address bar)
                                       // "redirect" = this page sends the visitor to the cloudflared link instead
  const PROBE = "/static/send.png";    // any small file your server serves; used to check that it is online
  /* ================================== */

  const CHECK_TIMEOUT = 7000;    // ms to wait for the server before calling it offline
  const RETRY_EVERY   = 10000;   // ms between automatic retries (the link is re-read each time)
  const OPEN_DELAY    = 500;     // ms to show "online" before opening

  const $ = id => document.getElementById(id);
  const status = $("status"), hint = $("hint"), openLink = $("open");
  let base = "", target = "", timer;

  function show(state, text, note) {
    document.body.dataset.state = state;
    status.textContent = text;
    hint.textContent = note || "";
  }

  // reads the current tunnel link from server.json (always fresh, never cached)
  async function readLink() {
    try {
      const r = await fetch(CONFIG_FILE + "?_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return "";
      const data = await r.json();
      const url = String(data.url || "").trim().replace(/\/+$/, "");
      return /^https?:\/\/[^\s/]+/i.test(url) && !/YOUR-TUNNEL/i.test(url) ? url : "";
    } catch (e) { return ""; }
  }

  function probe() {
    return new Promise(resolve => {
      const img = new Image();
      const done = ok => { clearTimeout(t); img.onload = img.onerror = null; resolve(ok); };
      const t = setTimeout(() => done(false), CHECK_TIMEOUT);
      img.onload  = () => done(true);
      img.onerror = () => done(false);
      img.src = base + PROBE + "?_=" + Date.now();          // cache-buster: always a fresh answer
    });
  }

  function open(mixed) {
    show("online", "Server online. Opening…");
    setTimeout(() => {
      if (MODE === "embed" && !mixed) {
        const f = document.createElement("iframe");
        f.className = "frame";
        f.title = "4ChatSDR";
        f.allow = "autoplay; clipboard-write; fullscreen; microphone";
        f.src = target;
        document.body.replaceChildren(f);
      } else {
        location.replace(target);
      }
    }, OPEN_DELAY);
  }

  async function start() {
    clearTimeout(timer);
    show("checking", "Contacting the server…");
    base = await readLink();
    if (!base) {
      show("setup", "No server link yet.", "Put your cloudflared link into server.json in the repository. This page keeps checking.");
      timer = setTimeout(start, RETRY_EVERY);
      return;
    }
    target = base + "/" + location.hash;                    // keeps a shared #f=…&m=… frequency link
    openLink.href = target;
    const mixed = location.protocol === "https:" && /^http:\/\//i.test(base);   // an https page can’t test an http server
    if (mixed || await probe()) { open(mixed); return; }
    show("offline", "The server isn’t answering.", "The tunnel may be down, or the link changed. This page re-reads server.json and tries again every 10 seconds.");
    timer = setTimeout(start, RETRY_EVERY);
  }

  $("retry").addEventListener("click", start);
  start();
})();
</script>
